<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bean VTuber — Phone Test</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#14161a; overflow:hidden; font-family: sans-serif; }
  #gl { position:fixed; inset:0; width:100%; height:100%; }
  #startBox { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.82); color:#fff; z-index:10; text-align:center; padding:24px; }
  #startBox h1 { font-size:26px; margin:0 0 10px; }
  #startBox p { font-size:17px; line-height:1.45; margin:0 0 22px; max-width:420px; }
  #startBtn { font-size:22px; font-weight:700; padding:16px 34px; border:0; border-radius:14px; background:#e07b28; color:#fff; }
  #status { position:fixed; left:0; right:0; bottom:0; padding:10px 14px; color:#fff; background:rgba(0,0,0,.55); font-size:15px; z-index:5; text-align:center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<img id="demoImg" src="./demo-face.jpg" style="display:none" alt="">
<canvas id="gl"></canvas>
<canvas id="overlay" style="position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none"></canvas>
<div id="startBox">
  <h1>Bean Test</h1>
  <p>Hold the phone up so your face is in the middle of the screen. You will see only the bean. Your real eyes and mouth show through the holes. Nothing else of you shows.</p>
  <button id="startBtn">Start the test</button>
</div>
<div id="status">Not started yet.</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const DEBUG = new URLSearchParams(location.search).has('debug');
let lastFace = null;
const statusEl = document.getElementById('status');
const video = document.getElementById('cam');
const demoImg = document.getElementById('demoImg');
const say = (t) => { statusEl.textContent = t; };

// ---------- three.js scene ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
renderer.setClearColor(0x14161a, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
let scene, camera, bean = null;
function sizeRenderer() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, -2000, 2000);
  camera.position.set(0, 0, 1000);
  camera.lookAt(0, 0, 0);
}
scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x40260f, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(0.4, 0.8, 1.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9a8, 0.5); rim.position.set(-1, 0.3, -0.8); scene.add(rim);
sizeRenderer();
addEventListener('resize', sizeRenderer);

// ---------- face patch: his camera, masked to a circle around his face,
// sitting BEHIND the bean. The bean covers it everywhere except the
// holes, so only his eyes and mouth ever show. ----------
const patchCanvas = document.createElement('canvas');
const patchCtx = patchCanvas.getContext('2d');
let patchTex = null, patchMesh = null;
function makePatch() {
  patchCanvas.width = innerWidth; patchCanvas.height = innerHeight;
  patchTex = new THREE.CanvasTexture(patchCanvas);
  patchTex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: patchTex, transparent: true });
  patchMesh = new THREE.Mesh(new THREE.PlaneGeometry(innerWidth, innerHeight), mat);
  patchMesh.position.set(0, 0, -100);
  scene.add(patchMesh);
}
function drawPatch(src, srcW, srcH, faceCx, faceCy, eyeDist, mirror) {
  const w = patchCanvas.width, h = patchCanvas.height;
  const scale = Math.max(w / srcW, h / srcH);
  const dw = srcW * scale, dh = srcH * scale;
  const ox = (w - dw) / 2, oy = (h - dh) / 2;
  patchCtx.clearRect(0, 0, w, h);
  patchCtx.save();
  if (mirror) { patchCtx.translate(w, 0); patchCtx.scale(-1, 1); }
  patchCtx.beginPath();
  patchCtx.arc(mirror ? w - faceCx : faceCx, faceCy, eyeDist * 1.02, 0, Math.PI * 2);
  patchCtx.clip();
  patchCtx.drawImage(src, ox, oy, dw, dh);
  patchCtx.restore();
  if (patchTex) patchTex.needsUpdate = true;
}

const EYE_MODEL = { x: 0.045, y: 0.494 };   // eye-line anchor in model units
const EYE_SPACING_MODEL = 0.376;            // distance between eye holes
const HOLE_WIDEN = 1.05;                    // holes sit a touch wider than his eyes (face-tested)

// smoothed state
const state = { x: 0, y: 0, s: 300, yaw: 0, pitch: 0, roll: 0, seen: false };
function placeBean() {
  if (!bean) return;
  const S = state.s;
  bean.scale.setScalar(S);
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(state.pitch, state.yaw, state.roll, 'YXZ'));
  bean.quaternion.copy(q);
  const anchor = new THREE.Vector3(EYE_MODEL.x * S, EYE_MODEL.y * S, 0).applyQuaternion(q);
  bean.position.set(state.x - anchor.x, state.y - anchor.y, 0);
  bean.visible = state.seen;
  if (patchMesh) patchMesh.visible = state.seen;
}
function loop() {
  placeBean();
  renderer.render(scene, camera);
  if (DEBUG) drawDebug();
  requestAnimationFrame(loop);
}
const dbgCtx = document.getElementById('overlay').getContext('2d');
function drawDebug() {
  const c = dbgCtx.canvas;
  if (c.width !== innerWidth) { c.width = innerWidth; c.height = innerHeight; }
  dbgCtx.clearRect(0, 0, c.width, c.height);
  if (!lastFace) { dbgCtx.fillStyle = '#fff'; dbgCtx.font = '24px sans-serif'; dbgCtx.fillText('DEBUG: no face seen yet', 20, 40); return; }
  const { eyeA, eyeB, nose, mouth, cx, cy, eyeDist } = lastFace;
  // camera preview, top-left
  const pw = 260, ph = pw * (video.videoHeight || 1) / (video.videoWidth || 1);
  if (video.videoWidth) dbgCtx.drawImage(video, 8, 8, pw, ph);
  dbgCtx.strokeStyle = '#fff'; dbgCtx.strokeRect(8, 8, pw, ph);
  const dot = (p, col, r) => { dbgCtx.fillStyle = col; dbgCtx.beginPath(); dbgCtx.arc(p.x, p.y, r || 9, 0, 7); dbgCtx.fill(); };
  dot(eyeA, 'lime'); dot(eyeB, 'lime'); dot(nose, 'cyan'); dot(mouth, 'magenta');
  dbgCtx.strokeStyle = 'yellow'; dbgCtx.lineWidth = 3;
  dbgCtx.beginPath(); dbgCtx.arc(cx, cy, eyeDist * 1.02, 0, 7); dbgCtx.stroke();
  // bean hole centres projected to screen (red)
  if (bean) {
    const S = state.s;
    for (const [hx, hy] of [[-0.143, 0.494], [0.233, 0.494], [0.051, 0.088]]) {
      const v = new THREE.Vector3(hx * S, hy * S, 0.30 * S).applyQuaternion(bean.quaternion).add(bean.position);
      dot({ x: v.x + innerWidth / 2, y: innerHeight / 2 - v.y }, 'red', 7);
    }
  }
  dbgCtx.fillStyle = '#fff'; dbgCtx.font = '22px sans-serif';
  dbgCtx.fillText('DEBUG video ' + video.videoWidth + 'x' + video.videoHeight + ' eyeDist ' + Math.round(eyeDist), 8, ph + 36);
  dbgCtx.fillText('green=tracker eyes  red=bean holes', 8, ph + 64);
}

// ---------- face points -> bean state (all in screen px, y down) ----------
// also returns the face-patch centre (a touch below the eyes) and eye distance
function updateFromPoints(eyeA, eyeB, nose) {
  const midX = (eyeA.x + eyeB.x) / 2, midY = (eyeA.y + eyeB.y) / 2;
  const dx = eyeB.x - eyeA.x, dy = eyeB.y - eyeA.y;
  const eyeDist = Math.hypot(dx, dy);
  if (eyeDist < 20) return null;
  const roll = Math.atan2(dy, dx);                       // screen-space, y down
  const yaw = THREE.MathUtils.clamp(((nose.x - midX) / eyeDist) * 1.35, -0.7, 0.7);
  const pitch = THREE.MathUtils.clamp(((nose.y - midY) / eyeDist - 1.0) * 1.1, -0.4, 0.5);
  const S = eyeDist * HOLE_WIDEN / EYE_SPACING_MODEL;
  const wx = midX - innerWidth / 2, wy = innerHeight / 2 - midY;
  const k = state.seen ? 0.35 : 1;
  state.x += (wx - state.x) * k;
  state.y += (wy - state.y) * k;
  state.s += (S - state.s) * k;
  state.yaw += (yaw - state.yaw) * k;
  state.pitch += ((-pitch) - state.pitch) * k;
  state.roll += ((-roll) - state.roll) * k;
  state.seen = true;
  return { cx: midX, cy: midY + eyeDist * 0.5, eyeDist };
}

// cover-fit mapping: media pixel coords -> screen px
function coverMap(mediaW, mediaH) {
  const scale = Math.max(innerWidth / mediaW, innerHeight / mediaH);
  const dw = mediaW * scale, dh = mediaH * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  return (x, y) => ({ x: ox + x * scale, y: oy + y * scale });
}

// ---------- start ----------
document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('startBox').style.display = 'none';
  try {
    say('Loading the bean…');
    const b64 = await (await fetch('./bean3d.b64')).text();
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const gltf = await new GLTFLoader().parseAsync(bytes.buffer, '');
    bean = gltf.scene;
    scene.add(bean);
    makePatch();
    loop();
    if (DEMO) startDemo(); else await startLive();
  } catch (e) {
    say('Something failed to load. Tell Muse this: ' + (e && e.message ? e.message : e));
  }
});

function startDemo() {
  say('Demo mode: only the bean shows, with the eyes and mouth from the photo.');
  const W0 = 1920, H0 = 1080;
  const eyeR = { x: 1298, y: 507 }, eyeL = { x: 1620, y: 517 }, nose0 = { x: 1467, y: 835 };
  function frame(t) {
    const map = coverMap(W0, H0);
    const sway = Math.sin(t / 1400);
    const nose = { x: nose0.x + sway * 95, y: nose0.y + Math.sin(t / 900) * 14 };
    const a = map(eyeR.x, eyeR.y), b = map(eyeL.x, eyeL.y), n = map(nose.x, nose.y);
    const f = updateFromPoints(a, b, n);
    if (f) drawPatch(demoImg, W0, H0, f.cx, f.cy, f.eyeDist, false);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function startLive() {
  say('Loading face tracking…');
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  let landmarker = null;
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate },
    runningMode: 'VIDEO', numFaces: 1,
    minFaceDetectionConfidence: 0.5, minFacePresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await vision.FaceLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch (e) { landmarker = await vision.FaceLandmarker.createFromOptions(fileset, opts('CPU')); }

  say('Opening your camera…');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  say(DEBUG ? 'Check page is on. Take a screenshot and send it to Muse.' : 'Live. Only the bean shows. Look left and right. Talk.');

  let lastTime = -1;
  function tick() {
    if (video.readyState >= 2 && video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      if (res && res.faceLandmarks && res.faceLandmarks.length) {
        const lm = res.faceLandmarks[0];
        const vw = video.videoWidth, vh = video.videoHeight;
        const map = coverMap(vw, vh);
        // mirrored selfie view: screen x = media width - x
        const pt = (i) => map(vw - lm[i].x * vw, lm[i].y * vh);
        const cR = avgPt(pt(33), pt(133)), cL = avgPt(pt(362), pt(263));
        const eyes = [cR, cL].sort((p, q) => p.x - q.x);
        const f = updateFromPoints(eyes[0], eyes[1], pt(1));
        if (f) {
          lastFace = { eyeA: eyes[0], eyeB: eyes[1], nose: pt(1), mouth: avgPt(pt(13), pt(14)), cx: f.cx, cy: f.cy, eyeDist: f.eyeDist };
          drawPatch(video, vw, vh, f.cx, f.cy, f.eyeDist, true);
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function avgPt(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
if (DEMO) setTimeout(() => document.getElementById('startBtn').click(), 300);
</script>
</body>
</html>
